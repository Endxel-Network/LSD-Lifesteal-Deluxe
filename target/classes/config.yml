# PLease use § to color the text not &

plugin-enabled: true

# Language settings
language: "en" # Available: en, es, fr, de, it, pt, ru, ja, zh

max-hearts: 20
min-hearts: 1

custom-heart-name: "&c&l❤ Extra Heart"
custom-heart-lore:
  - "&7Right-click to consume"
  - "&7Gives you +1 heart"

lose-heart-on-death: true
gain-heart-on-kill: true
drop-heart-on-death: false
heart-drop-chance: 100
drop-to-floor: false

messages:
  prefix: "§6[Lifesteal] §r"
  heart-gained: "§a+1 Heart! You now have {hearts} hearts."
  heart-lost: "§c-1 Heart! You now have {hearts} hearts."
  heart-stolen: "§a+1 Heart stolen from {victim}! You now have {hearts} hearts."
  victim-heart-stolen: "§c-1 Heart stolen by {killer}! You now have {hearts} hearts."
  cannot-lose-heart: "&cThis player only has 1 heart remaining so they can't lose any more!"
  heart-dropped: "§6A heart dropped from your death!"
  hearts-set: "§aSet {player}'s hearts to {hearts}"
  hearts-added: "§aAdded {amount} hearts to {player} ({old} → {new})"
  hearts-removed: "§aRemoved {amount} hearts from {player} ({old} → {new})"
  hearts-withdrawn: "§aWithdrew {amount} hearts! You now have {hearts} hearts."
  hearts-deposited: "§aDeposited {amount} hearts! You now have {hearts} hearts."
  no-permission: "§cYou don't have permission to use this command!"
  player-not-found: "§cPlayer not found: {player}"
  invalid-amount: "§cInvalid amount: {amount}"
  amount-too-high: "§cAmount must be between {min} and {max}"
  amount-positive: "§cAmount must be positive!"
  exceed-max: "§cYou can't deposit that many hearts! You would exceed the maximum of {max} hearts."
  below-min: "§cYou can't withdraw that many hearts! You need at least {min} hearts."

worlds:
  enabled-worlds: []
  disabled-worlds: []

pvp:
  enabled: true
  require-same-world: true
  require-same-gamemode: false

# Ban system for players who reach minimum hearts (LIFESTEAL SERVER ONLY)
ban-system:
  enabled: true
  ban-duration: "1d" # 1 day, 1w for week, 1m for month, etc.
  ban-message: "&cYou have been banned from the lifesteal server for reaching the minimum heart limit!"
  warning-message: "&cWarning: You are on your last heart! You will be banned from this server if you die again!"
  kick-message: "&cYou have been kicked from the lifesteal server for reaching the minimum heart limit!"
  prevent-join: true # Prevent players with minimum hearts from joining the server


database:
  type: "file"
  mysql:
    host: ""
    port: 3306
    database: ""
    username: ""
    password: ""
    use-ssl: false


# Command aliases - customize command shortcuts
command-aliases:
  lifesteal:
    - "ls"
    - "lsd"
  hearts:
    - "h"
    - "heart"
  withdraw:
    - "w"
  sethearts:
    - "sh"
  setmax:
    - "sm"
  addhearts:
    - "ah"
  removehearts:
    - "rh"
  payhearts:
    - "ph"

advanced:
  save-interval: 300
  backup-on-reload: true
  debug-mode: false
